name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda-build:
    name: Linux CUDA 12.8 build matrix
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.8.0-devel-ubuntu22.04
    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends ca-certificates git
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Build solver and pool miner for all shipped architectures
        run: ./build_all.sh

      # Experimental trim options are off by default. Compile each one, and
      # the combinations that interact, so they keep building until the GPU
      # measurements decide whether to enable them. TARI_ARCH_FLAGS follow the
      # release profile flags, so -DRECOVERY_SMALL_OUTPUT=0 overrides the
      # profile's =1 (the host compiler warns that it was redefined).
      - name: Build experimental trim option matrix
        shell: bash
        run: |
          set -euo pipefail
          flag_sets=(
            "-DLATE_ROUND_SELF_ZERO_IDX=1"
            "-DLATE_ROUND_SELF_ZERO_IDX=1 -DFUSE_FINAL_TAIL_CURRENT=1 -DSKIP_LATE_NULL_CHECKS=0 -DRECOVERY_SMALL_OUTPUT=0 -DTRIM_STAGE_TIMING=1"
            "-DTRIM_CUDA_GRAPH=1"
            "-DTRIM_CUDA_GRAPH=1 -DTRIM_STAGE_TIMING=1 -DROUND0_DST_HASH_DYNAMIC_BITS=12"
            "-DLATE_ROUND_BPB=2"
            "-DLATE_ROUND_BPB=4 -DWARP_DST_ATOMICS_LATE=1 -DROUND_LATE_TPB=512"
            "-DLATE_ROUND_BPB=8 -DSKIP_LATE_NULL_CHECKS=0 -DROUND_LATE_TPB=1024 -DTRIM_STAGE_TIMING=1"
            "-DLATE_ROUND_SELF_ZERO_IDX=1 -DTRIM_CUDA_GRAPH=1 -DLATE_ROUND_BPB=4 -DFUSE_FINAL_TAIL_CURRENT=1 -DTRIM_STAGE_TIMING=1"
            "-DLATE_ROUND_SELF_ZERO_IDX=1 -DTRIM_CUDA_GRAPH=1 -DLATE_ROUND_BPB=8 -DFUSE_FINAL_TAIL_CURRENT=0 -DSKIP_LATE_NULL_CHECKS=0 -DRECOVERY_SMALL_OUTPUT=0"
            "-DSEEDA_CHECKPOINT=8"
            "-DSEEDA_CHECKPOINT=16 -DTRIM_STAGE_TIMING=1"
            "-DSEEDA_CHECKPOINT=32"
          )
          for flags in "${flag_sets[@]}"; do
            echo "::group::solver sm_89: $flags"
            TARI_ARCH_FLAGS="$flags" ./build_solver.sh sm_89
            echo "::endgroup::"
          done
          echo "::group::pool miner sm_89: all experimental trim options"
          TARI_ARCH_FLAGS="-DLATE_ROUND_SELF_ZERO_IDX=1 -DTRIM_CUDA_GRAPH=1 -DLATE_ROUND_BPB=4" ./build_pool_miner.sh sm_89
          echo "::endgroup::"
          echo "::group::pool miner sm_89: checkpointed SeedA"
          TARI_ARCH_FLAGS="-DSEEDA_CHECKPOINT=16" ./build_pool_miner.sh sm_89
          echo "::endgroup::"

  hip-build:
    name: Linux HIP build
    runs-on: ubuntu-latest
    # ROCm 7.2 supports every AMD target the build ships, including the RDNA4
    # gfx1200 and gfx1201.
    container:
      image: rocm/dev-ubuntu-22.04:7.2.4
    defaults:
      run:
        shell: bash
    env:
      HIPCC: /opt/rocm/bin/hipcc
    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends ca-certificates git
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Show the HIP toolchain
        run: |
          "$HIPCC" --version

      - name: Build solver and pool miner for amd
        run: |
          set -euo pipefail
          ./build_solver.sh amd
          ./build_pool_miner.sh amd
          ./build_solver.sh amd reference

      # The runner has no AMD GPU; the binaries are kept so a pull request can
      # be checked on real hardware (docs/amd-validation.md) without a local
      # hipcc.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: amd-binaries-${{ github.sha }}
          path: |
            bin/tari_c29_pool_miner_amd
            bin/tari_c29_solver_amd
            bin/validation/tari_c29_solver_amd_reference
          if-no-files-found: error
          retention-days: 14

      # The runner has no AMD GPU: the binaries must start, answer --help and
      # --version, and report that there is no device instead of crashing.
      - name: Run the AMD binaries without a GPU
        run: |
          set -uo pipefail
          miner=bin/tari_c29_pool_miner_amd
          solver=bin/tari_c29_solver_amd
          ldd "$miner" | grep -E 'amdhip64' || { echo "::error::$miner does not link libamdhip64"; exit 1; }
          "$miner" --version || exit 1
          "$miner" --help > /tmp/help.out || exit 1
          grep -qF -- '--list-devices' /tmp/help.out || { echo "::error::--help does not list --list-devices"; exit 1; }
          "$solver" --version || exit 1
          "$solver" --help > /dev/null || exit 1

          status=0
          "$miner" --list-devices > /tmp/list.out 2> /tmp/list.err || status=$?
          echo "--list-devices exit $status"; cat /tmp/list.out /tmp/list.err
          if ((status != 0)); then
            echo "::error::--list-devices exited $status without a GPU; expected 0"
            exit 1
          fi
          if [[ -s /tmp/list.out ]]; then
            echo "::error::--list-devices listed devices on a runner without a GPU"
            exit 1
          fi
          grep -qF "no HIP GPU devices found" /tmp/list.err || { echo "::error::--list-devices gave no clear no-device message"; exit 1; }

          status=0
          "$solver" --count 1 > /tmp/solver.out 2> /tmp/solver.err || status=$?
          echo "solver exit $status"; cat /tmp/solver.out /tmp/solver.err
          if ((status != 1)); then
            echo "::error::the solver exited $status without a GPU; expected 1"
            exit 1
          fi
          grep -qF "no HIP device 0" /tmp/solver.err || { echo "::error::the solver gave no clear no-device message"; exit 1; }

      # Options that change shared memory use or the warp code. One gfx target
      # per RDNA generation keeps this quick.
      - name: Build the AMD option matrix
        env:
          AMD_OFFLOAD_ARCHES: gfx1030 gfx1100 gfx1201
        run: |
          set -euo pipefail
          flag_sets=(
            "-DSEEDA_CHECKPOINT=16"
            "-DLATE_ROUND_BPB=4"
            "-DLATE_ROUND_BPB=2 -DLATE_ROUND_SELF_ZERO_IDX=1 -DROUND_LATE_TPB=512"
            "-DROUND0_DST_HASH_DYNAMIC_BITS=12 -DROUND0_DST_HASH_FALLBACK_PLAIN=0"
            "-DWARP_DST_ATOMICS_LATE=1 -DFUSE_FINAL_TAIL_CURRENT=1 -DSKIP_LATE_NULL_CHECKS=0"
            "-DROUND_U64_EDGE_LOAD=1 -DTRIM_STAGE_TIMING=1"
          )
          for flags in "${flag_sets[@]}"; do
            echo "::group::solver amd: $flags"
            TARI_ARCH_FLAGS="$flags" ./build_solver.sh amd
            echo "::endgroup::"
          done
          echo "::group::pool miner amd: checkpointed SeedA"
          TARI_ARCH_FLAGS="-DSEEDA_CHECKPOINT=16" ./build_pool_miner.sh amd
          echo "::endgroup::"

      # Options the HIP build cannot run must stop the build with a clear
      # message rather than fail at launch.
      - name: Check unsupported options are rejected at compile time
        env:
          AMD_OFFLOAD_ARCHES: gfx1100
        run: |
          set -uo pipefail
          expect_rejected() {
            local flags="$1" message="$2"
            if TARI_ARCH_FLAGS="$flags" ./build_solver.sh amd > /tmp/rejected.log 2>&1; then
              echo "::error::$flags built, but the HIP build must reject it"
              exit 1
            fi
            if ! grep -qF -- "$message" /tmp/rejected.log; then
              cat /tmp/rejected.log
              echo "::error::$flags failed without the expected message: $message"
              exit 1
            fi
            echo "$flags rejected: $message"
          }
          expect_rejected "-DLATE_ROUND_BPB=8" "LATE_ROUND_BPB needs more than the 64 KB"
          expect_rejected "-DROUND0_DST_HASH_DYNAMIC_BITS=13" "ROUND0_DST_HASH_DYNAMIC_BITS needs more than the 64 KB"
          expect_rejected "-DTRIM_CUDA_GRAPH=1" "TRIM_CUDA_GRAPH is not supported by the HIP (AMD) build"

  linux:
    name: Linux CPU and script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run pool protocol regressions
        run: |
          g++ -std=c++17 -O2 -pthread -I. \
            tests/tari_pool_protocol_test.cpp \
            -o tests/tari_pool_protocol_test
          tests/tari_pool_protocol_test

      - name: Build and run miner reliability regressions
        run: |
          g++ -std=c++17 -O2 -I. \
            tests/tari_miner_reliability_test.cpp \
            -o tests/tari_miner_reliability_test
          tests/tari_miner_reliability_test

      - name: Build and run pipeline selection regressions
        run: |
          g++ -std=c++17 -O2 -I. \
            tests/tari_miner_pipeline_test.cpp \
            -o tests/tari_miner_pipeline_test
          tests/tari_miner_pipeline_test

      - name: Build and run speed meter regressions
        run: |
          g++ -std=c++17 -O2 -I. \
            tests/tari_miner_stats_test.cpp \
            -o tests/tari_miner_stats_test
          tests/tari_miner_stats_test

      - name: Build and run worker thread regressions
        run: |
          g++ -std=c++17 -O2 -pthread -I. \
            tests/tari_miner_worker_test.cpp \
            -o tests/tari_miner_worker_test
          tests/tari_miner_worker_test

      - name: Build and run cycle-finding graph regressions
        run: |
          for flags in -DGRAPH_UNION_SKIP=0 -DGRAPH_UNION_SKIP=1 \
              "-DGRAPH_UNION_SKIP=1 -DNDEBUG"; do
            g++ -std=c++17 -O2 $flags \
              -I. -Ithird_party/cuckoo/src/cuckaroo \
              tests/tari_graph_test.cpp \
              -o tests/tari_graph_test
            tests/tari_graph_test
          done

      - name: Build and run SeedA schedule regressions
        run: |
          g++ -std=c++17 -O2 -I. \
            tests/tari_seeda_schedule_test.cpp \
            -o tests/tari_seeda_schedule_test
          tests/tari_seeda_schedule_test

      - name: Run GPU recall verifier fixtures
        run: python3 tests/tari_c29_gpu_recall.py --self-test

      - name: Build and run Tari wrapper self-test
        run: |
          g++ -std=c++17 -O2 \
            tari_c29.cpp tari_c29_selftest.cpp \
            -o tari_c29_selftest
          ./tari_c29_selftest

      - name: Check shell syntax
        run: |
          bash -n \
            start-c29.sh \
            build_all.sh \
            build_pool_miner.sh \
            build_solver.sh \
            build_flags/read_arch_flags.sh \
            tests/build_flags_test.sh \
            hiveos/h-config.sh \
            hiveos/h-run.sh \
            hiveos/h-stats.sh \
            tests/hiveos_stats_test.sh \
            tools/ntrims_sweep.sh \
            tests/ntrims_sweep_test.sh \
            tools/seeda_spill_report.sh

      - name: Run shell launcher regressions
        run: bash tests/start_c29_launcher_test.sh

      # HiveOS uses mawk as awk; also check gawk.
      - name: Run HiveOS stats parse regressions
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mawk gawk
          AWK=mawk bash tests/hiveos_stats_test.sh
          AWK=gawk bash tests/hiveos_stats_test.sh

      - name: Run build flag reader regressions
        run: bash tests/build_flags_test.sh

      - name: Run ntrims sweep dry-run regressions
        run: bash tests/ntrims_sweep_test.sh

  windows:
    name: Windows CPU and launcher checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run C++ regression tests
        shell: powershell
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $install) {
            throw 'Visual Studio C++ tools were not found.'
          }
          $command = @(
            "call `"$install\VC\Auxiliary\Build\vcvars64.bat`" >nul",
            'cl /nologo /std:c++17 /EHsc /O2 /I. tests\tari_pool_protocol_test.cpp /Fe:tests\tari_pool_protocol_test.exe',
            'tests\tari_pool_protocol_test.exe',
            'cl /nologo /std:c++17 /EHsc /O2 /I. tests\tari_miner_reliability_test.cpp /Fe:tests\tari_miner_reliability_test.exe',
            'tests\tari_miner_reliability_test.exe',
            'cl /nologo /std:c++17 /EHsc /O2 /I. tests\tari_miner_pipeline_test.cpp /Fe:tests\tari_miner_pipeline_test.exe',
            'tests\tari_miner_pipeline_test.exe',
            'cl /nologo /std:c++17 /EHsc /O2 /I. tests\tari_miner_stats_test.cpp /Fe:tests\tari_miner_stats_test.exe',
            'tests\tari_miner_stats_test.exe',
            'cl /nologo /std:c++17 /EHsc /O2 /I. tests\tari_miner_worker_test.cpp /Fe:tests\tari_miner_worker_test.exe',
            'tests\tari_miner_worker_test.exe',
            'cl /nologo /std:c++17 /EHsc /O2 /DGRAPH_UNION_SKIP=0 /I. /Ithird_party\cuckoo\src\cuckaroo tests\tari_graph_test.cpp /Fe:tests\tari_graph_test.exe',
            'tests\tari_graph_test.exe',
            'cl /nologo /std:c++17 /EHsc /O2 /DGRAPH_UNION_SKIP=1 /I. /Ithird_party\cuckoo\src\cuckaroo tests\tari_graph_test.cpp /Fe:tests\tari_graph_test.exe',
            'tests\tari_graph_test.exe',
            'cl /nologo /std:c++17 /EHsc /O2 /DGRAPH_UNION_SKIP=1 /DNDEBUG /I. /Ithird_party\cuckoo\src\cuckaroo tests\tari_graph_test.cpp /Fe:tests\tari_graph_test.exe',
            'tests\tari_graph_test.exe',
            'cl /nologo /std:c++17 /EHsc /O2 tari_c29.cpp tari_c29_selftest.cpp /Fe:tari_c29_selftest.exe',
            'tari_c29_selftest.exe',
            'cl /nologo /std:c++17 /EHsc /O2 /I. tests\tari_seeda_schedule_test.cpp /Fe:tests\tari_seeda_schedule_test.exe',
            'tests\tari_seeda_schedule_test.exe'
          ) -join ' && '
          & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Check PowerShell launcher syntax
        shell: powershell
        run: |
          foreach ($path in @(
            '.\start-c29.ps1',
            '.\tools\ntrims_sweep.ps1',
            '.\tests\ntrims_sweep_test.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $errors | Format-List
              exit 1
            }
          }
          $manifest = [IO.File]::ReadAllBytes(
            (Resolve-Path '.\hiveos\h-manifest.conf')
          )
          if ($manifest -contains 13) {
            throw 'HiveOS manifest must use LF line endings.'
          }

      - name: Run PowerShell launcher regressions
        shell: powershell
        run: .\tests\start_c29_launcher_test.ps1

      - name: Run batch build flag reader regressions
        shell: powershell
        run: .\tests\build_flags_test.ps1

      - name: Run GPU recall verifier fixtures
        shell: powershell
        run: python tests\tari_c29_gpu_recall.py --self-test

      - name: Run ntrims sweep dry-run regressions
        shell: powershell
        run: .\tests\ntrims_sweep_test.ps1
